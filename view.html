<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Xem ảnh mới nhất</title><link rel="stylesheet" href="style.css"></head>
<body><main class="viewer">
  <div class="viewer-top"><h1>🖥️ Ảnh mới nhất từ điện thoại</h1><div class="pill" id="connection" role="status" aria-live="polite">Đang kết nối...</div></div>
  <section class="image-panel"><div class="empty" id="empty"><div class="empty-icon" aria-hidden="true">🖼️</div><div id="status">Đang tìm ảnh mới nhất...</div></div><img class="received-photo" id="photo" alt="Ảnh mới nhất đã tải từ điện thoại" hidden></section>
  <div class="actions"><a href="#" class="action" id="download" hidden download="anh-gan-nhat.jpg">Lưu ảnh về máy tính</a><button class="action" id="refresh" type="button">Kiểm tra ngay</button></div>
  <p class="info" id="updated">Trang tự kiểm tra ảnh mới khoảng 8 giây/lần. Không cần mã phòng và không cần kết nối trực tiếp với điện thoại.</p>
  <p class="private">Không chia sẻ đường dẫn riêng có khóa truy cập cho người khác.</p>
</main><script src="config.js"></script><script src="view.js"></script></body></html>

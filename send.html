<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Gửi ảnh — Chạm để tải</title><link rel="stylesheet" href="style.css"></head>
<body class="send-page">
  <button class="tap-zone" id="tapZone" type="button" aria-label="Chạm vào đây để mở trình chọn ảnh. Có tiếng ting xác nhận.">
    <span class="main-icon" aria-hidden="true">📸</span>
    <span class="main-title">CHẠM ĐỂ GỬI ẢNH</span>
    <span class="main-caption">Chạm một lần để mở ảnh · Chọn ảnh · Tự gửi lên máy tính</span>
    <span class="send-status" id="status" role="status" aria-live="polite">Trang đã mở. Chạm bất kỳ đâu.</span>
    <span class="mini">Web sẽ thử phát tiếng ting khi tải trang và phát tiếng khi chạm. Âm thanh tự phát có thể bị Chrome chặn.</span>
  </button>
  <input class="sr-file" id="fileInput" type="file" accept="image/*" aria-label="Chọn ảnh muốn gửi">
  <script src="config.js"></script><script src="send.js"></script>
</body></html>
